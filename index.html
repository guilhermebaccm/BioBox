.journeyTabs{display:flex;gap:8px;flex-wrap:wrap;margin:28px 0 4px}.journeyTab{border:1px solid var(--line);background:white;border-radius:999px;padding:12px 18px;font-weight:800;cursor:pointer}.journeyTab.active{background:#08111f;color:white;border-color:#08111f}.maturityTrack{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:24px 0}.maturityStage{position:relative;border:1px solid var(--line);background:white;border-radius:18px;padding:17px;text-align:left;cursor:pointer;transition:.2s}.maturityStage:hover,.maturityStage.active{border-color:#16a34a;box-shadow:0 12px 28px #15803d14;transform:translateY(-2px)}.maturityStage .maturityNo{display:grid;width:36px;height:36px;place-items:center;border-radius:50%;background:linear-gradient(135deg,#16a34a,#0891b2);color:white;font-weight:900;margin-bottom:10px}.maturityStage small{display:block;color:var(--muted);margin-bottom:4px}.journeyGrid{display:grid;grid-template-columns:1.15fr .85fr;gap:22px}.challengeBox{padding:18px;border:1px solid #fde68a;background:#fffbeb;border-radius:18px;margin-bottom:16px}.challengeBox small,.bioPriority small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:850;color:#a16207;margin-bottom:7px}.deliverables{display:grid;gap:8px;margin-top:12px}.deliverable{display:flex;gap:9px;align-items:flex-start;padding:11px 13px;border-radius:13px;background:#f8fafc}.deliverable:before{content:'✓';color:#16a34a;font-weight:900}.bioPriority{margin-top:16px;padding:18px;border:1px solid #c4b5fd;background:#f5f3ff;border-radius:18px}.bioPriority small{color:#6d28d9}.stageQuestion{margin-top:18px;padding:18px;border-radius:18px;background:#052e16;color:white;line-height:1.6}.stageQuestion small{display:block;color:#86efac;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:850;margin-bottom:6px}.companyLinks a{display:flex;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:14px;padding:13px;margin-top let roadmapActive=1;
function openRoadmap(){active='roadmap';roadmapActive=1;companyActive=1;roadmapMode='company';render();scrollTo(0,0)}
function selectRoadmapStage(n){roadmapActive=n;render();scrollTo({top:document.querySelector('.roadmapNav').offsetTop-90,behavior:'smooth'})}
function productRoadmap(){const s=roadmapStages.find(x=>x.n===roadmapActive);return `<div><div class="roadmapNav">${roadmapStages.map(x=>`<button class="roadmapStep ${x.n===roadmapActive?'active':''}" onclick="selectRoadmapStage(${x.n})"><span class="stepNo">${x.n}</span><small>Etapa ${x.n}</small><b>${x.short}</b></button>`).join('')}</div><article class="roadmapPanel"><div><span class="eyebrow">ETAPA ${s.n} DE 6</span><h2>${s.title}</h2><p class="roadmapSubtitle">${s.subtitle}</p><div class="roadmapActions">${s.actions.map((a,i)=>`<div class="roadmapAction"><strong>${i+1}</strong><span>${a}</span></div>`).join('')}</div><div class="roadmapGate"><small>Ponto de decisão</small>${s.gate}</div></div><aside><div class="roadmapOutput"><small>Entrega esperada</small><b>${s.outcome}</b></div><div class="roadmapLinks"><h3>Links úteis</h3>${s.links.map(l=>`<a class="roadmapLink" href="${l[1]}" target="_blank" rel="noreferrer"><span>${l[0]}</span><span>↗</span></a>`).join('')}</div></aside></article></div>`}
function roadmapPage(){return `<main><section class="roadmapHero"><div class="wrap"><button class="back" onclick="home()">← Voltar ao início</button><span class="eyebrow" style="color:#67e8f9">DA IDEIA AO MERCADO</span><h1>Jornada Empresarial e Roadmap Biotech</h1><p>Identifique o estágio da empresa e consulte as ações, entregas, critérios de avanço e prioridades técnicas mais relevantes.</p></div></section><section class="section"><div class="wrap"><div class="journeyTabs"><button class="journeyTab ${roadmapMode==='company'?'active':''}" onclick="setRoadmapMode('company')">Jornada da empresa</button><button class="journeyTab ${roadmapMode==='product'?'active':''}" onclick="setRoadmapMode('product')">Desenvolvimento do produto biotech</button></div>${roadmapMode==='company'?companyJourney():productRoadmap()}<p class="roadmapDisclaimer">Ferramenta orientativa. As necessidades variam conforme modelo de negócio, produto, mercado e jurisdição.</p></div></section></main>`}
function render(){document.querySelector('#app').innerHTML=active==='roadmap'?roadmapPage():(active?pillarPage():landing())}render();
